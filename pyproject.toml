[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "todone-cli"
version = "0.1.0"
description = "Every TODO in the repo, oldest first, with the age from git blame."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alisher Muhammadaliyev", email = "viltrumlik@gmail.com" }]
keywords = ["todo", "fixme", "technical-debt", "git-blame", "ci", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Viltrumlik/todone"
Issues = "https://github.com/Viltrumlik/todone/issues"

[project.scripts]
todone = "todone:main"

[tool.setuptools]
py-modules = ["todone"]
